<style>
:root{--ink:#4a3f6b;--soft:#8f84b3;--pri:#a78bfa;--pk:#ffc8dd;--lil:#d9c8ff;--sky:#bde0fe;--mint:#c4f5d0;--pch:#ffe0b8;--glass:rgba(255,255,255,.66)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Quicksand','Hind',sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(165deg,#fde2f3,#e4d9ff 48%,#d3eaff) fixed}
button,input,textarea{font:inherit;color:inherit}
.blob{position:fixed;border-radius:50%;filter:blur(55px);opacity:.6;z-index:0;pointer-events:none;animation:fl 16s ease-in-out infinite alternate}
.b1{width:260px;height:260px;background:var(--pk);top:-60px;left:-60px}.b2{width:300px;height:300px;background:var(--sky);bottom:5%;right:-90px;animation-delay:-5s}.b3{width:200px;height:200px;background:var(--pch);top:40%;left:-70px;animation-delay:-9s}
@keyframes fl{to{transform:translate(30px,-40px) scale(1.15)}}
@media(prefers-reduced-motion:reduce){.blob{animation:none}}
#loader,#auth,#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;background:linear-gradient(165deg,#fde2f3,#e4d9ff 48%,#d3eaff)}
#loader{z-index:70;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#fff6fc 0%,#f6f5fc 38%,#eef3fc 62%,#e3f0fd 100%);transition:opacity .55s ease,visibility .55s}
#loader.out{opacity:0;visibility:hidden}
#loader .cl{position:absolute;border-radius:50%;background:#fff;filter:blur(2px);opacity:.75}
#loader .ct{position:absolute;inset:0 0 auto 0;height:30%;pointer-events:none}
#loader .cb2{position:absolute;inset:auto 0 0 0;height:52%;pointer-events:none}
#loader .cw{position:absolute;left:0;width:200%;height:100%;animation:cdr 38s linear infinite}
#loader .cw.w2{animation-duration:55s;animation-direction:reverse;opacity:.7}
#loader .cw svg{width:50%;height:100%;float:left;display:block}
@keyframes cdr{to{transform:translateX(-50%)}}
#loader .lg{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;animation:lgIn .9s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes lgIn{from{opacity:0;transform:translateY(24px) scale(.6)}to{opacity:1;transform:none}}
#loader .ic2{width:112px;height:112px;animation:bob 3s ease-in-out .9s infinite;filter:drop-shadow(0 14px 18px rgba(150,110,220,.35))}
@keyframes bob{50%{transform:translateY(-10px) rotate(-1.5deg)}}
#loader .ic2 svg{width:100%;height:100%;overflow:visible}
#loader .fp path{stroke-dasharray:120;stroke-dashoffset:120;animation:fpd 1.8s ease-in-out .5s infinite alternate}
@keyframes fpd{to{stroke-dashoffset:0}}
#loader .shn{position:absolute;inset:0;border-radius:26px;overflow:hidden;pointer-events:none;-webkit-mask-image:radial-gradient(#000,#000);}
#loader .shn::after{content:'';position:absolute;top:-20%;bottom:-20%;width:34%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-18deg);animation:shn 2.6s ease-in-out 1.1s infinite}
@keyframes shn{to{left:140%}}
#loader .ic2w{position:relative}
#loader .dtz{display:flex;gap:7px;margin-top:26px}
#loader .dtz i{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#7aa7ff,#e879c8);animation:dz 1.1s ease-in-out infinite}
#loader .dtz i:nth-child(2){animation-delay:.18s}#loader .dtz i:nth-child(3){animation-delay:.36s}
@keyframes dz{0%,80%,100%{transform:scale(.55);opacity:.4}40%{transform:scale(1.15);opacity:1}}
#loader .brand2{position:absolute;bottom:calc(46px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;z-index:2;animation:fadeUp .9s ease .5s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#loader .brand2 svg{width:150px;height:auto;overflow:visible}
#loader .fth{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(-8deg) translateY(-2px)}}
@media(prefers-reduced-motion:reduce){#loader *{animation:none!important}}

.bd{flex:1;min-width:0}.tt{font-weight:700;font-size:16px}.sn{color:#6c628f;font-size:14px;margin:3px 0 6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.empty{text-align:center;color:var(--soft);padding:34px 10px;line-height:1.7}.empty .big{font-size:46px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(420px,92%);z-index:20;display:flex;justify-content:space-around;align-items:center;padding:8px 10px}
nav button{border:none;background:none;font-size:23px;padding:8px 12px;border-radius:16px;cursor:pointer;opacity:.5}nav button.on{opacity:1;background:#ffffffb0}
nav .fab{width:58px;height:58px;border-radius:50%;margin-top:-30px;font-size:26px;opacity:1;background:linear-gradient(135deg,#c4b5fd,#f9a8d4);box-shadow:0 8px 20px rgba(167,139,250,.5);color:#fff}
.cn{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.cn b{font-size:17px}
.cn button{border:none;background:#fff;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.cg small{color:var(--soft);font-size:11.5px;font-weight:600;padding:4px 0}
.cd{border:none;background:#ffffff80;border-radius:14px;aspect-ratio:1;font-size:13px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.cd span{font-size:15px;min-height:16px}.cd.has{background:#fff}.cd.today{outline:2px solid var(--pri)}.cd.sel{background:var(--lil)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.sc{padding:16px;text-align:center}.sc b{font-family:'Caveat',cursive;font-size:38px;display:block;line-height:1}.sc small{color:var(--soft);font-weight:600}
.bar{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13.5px;font-weight:600}.bar i{display:block;height:12px;border-radius:8px;min-width:6px}
.set{padding:16px;margin-bottom:12px}.set h3{margin:0 0 10px}.set .btn{margin-top:8px}
#ed{position:fixed;inset:0;z-index:45;background:linear-gradient(165deg,#fff1f8,#efe8ff 50%,#e6f3ff);display:none;flex-direction:column;--tx:#4a3f6b}
#ed.dark{--tx:#f5f3ff}
.edh{display:flex;align-items:center;gap:8px;padding:12px 14px}

.sv{border:none;background:linear-gradient(135deg,#c4b5fd,#f9a8d4);color:#fff;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer}
#mnu,#mdPop{display:none;position:absolute;right:0;top:46px;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(80,60,140,.25);z-index:5;padding:8px}
#mnu button{display:block;border:none;background:none;padding:10px 14px;text-align:left;white-space:nowrap;cursor:pointer;font-weight:600;width:100%;color:#4a3f6b}
#mdPop{width:290px;grid-template-columns:repeat(5,1fr);gap:6px}
#mdPop .mdpg{grid-column:1/-1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
#mdPop .mdpg::-webkit-scrollbar{display:none}
#mdPop .mdp{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:42px;gap:6px;justify-items:center;align-content:start;min-height:90px}
#mdPop .mddots{grid-column:1/-1;display:flex;justify-content:center;gap:6px;min-height:0}

#mdPop button{position:relative}
#mdPop .mdx{animation:mdw .5s ease-in-out infinite alternate}
@keyframes mdw{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
#mdPop .mdx i{position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:#ef4a6b;color:#fff;font:700 10px/18px sans-serif;font-style:normal;text-align:center}
#mdPop .mdadd{grid-column:1/-1;display:flex;gap:6px;margin-top:4px;padding-top:8px;border-top:1px solid #eee8fa}

#mdPop .mdadd .mdin:empty::before{color:#8a86a8}
#mdPop .mdadd .mdin{flex:1;min-width:0;border:1px solid #e0d6f7;border-radius:21px;padding:0 14px;height:42px;font:inherit;font-size:16px;outline:0;background:#faf7ff}

#mdPop .mdadd .ed.on{background:#7c5cf0;color:#fff}

#mdPop button{border:none;background:#f6f1ff;border-radius:50%;width:42px;height:42px;font-size:23px;cursor:pointer}

.md{border:none;background:#ffffffb0;border-radius:50%;width:46px;height:46px;font-size:27px;cursor:pointer}

.pb{border:none;background:none;font-size:21px;padding:9px 10px;border-radius:12px;cursor:pointer;color:#4a3f6b}.pb.on{background:var(--lil)}

.rw{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* ===== Note view mode (3 premium themes) ===== */
#nv{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;overflow:hidden;

#nv .nvart{position:relative;max-width:720px;margin:0 auto;padding:30px 16px 20px;background:var(--nvcard);border:1px solid var(--nvcb);border-radius:28px;box-shadow:var(--nvsh);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);overflow:hidden}
@media(min-width:700px){#nv .nvart{max-width:1000px;padding:36px 28px 26px}}
/* Theme 1 — Lavender */
#nv:not([data-th="2"]):not([data-th="3"]){background-image:radial-gradient(70% 38% at 12% 0%,rgba(168,140,255,.35),transparent 70%),radial-gradient(60% 34% at 100% 22%,rgba(255,160,220,.3),transparent 70%),var(--nvbg)}
#nv:not([data-th="2"]):not([data-th="3"]) .nvart::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#8b7cf6,#d36bf0,#ff9ad0)}
#nv:not([data-th="2"]):not([data-th="3"]) .nvh h1{background:linear-gradient(100deg,#2b2066,#6a4be0 70%,#b04fe0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;font-size:35px}
#nv.dark:not([data-th="2"]):not([data-th="3"]) .nvh h1{background:none;-webkit-text-fill-color:currentColor;color:var(--nvi)}
#nv.dark{--nvcard:rgba(20,16,44,.5);--nvcb:rgba(255,255,255,.16);--nvsh:0 24px 60px rgba(0,0,0,.4)}
#nv:not([data-th="2"]):not([data-th="3"]) .nvart{border:1.5px solid rgba(124,92,240,.4)}
#nv.dark:not([data-th="2"]):not([data-th="3"]) .nvart{border-color:rgba(255,255,255,.32)}
#nv:not([data-th="2"]):not([data-th="3"]) .nvmeta span{background:rgba(124,92,240,.1);box-shadow:inset 0 0 0 1px rgba(124,92,240,.14)}
#nv:not([data-th="2"]):not([data-th="3"]) .nvb{margin-top:6px}
/* Theme 2 — Ivory Journal (paper sheet) */
#nv[data-th="2"]{--nvbg:linear-gradient(180deg,#e6d8bd,#d9c7a4);--nvcard:#fffaf0;--nvcb:rgba(169,120,43,.35);--nvsh:0 1px 0 #d8c7a3,0 6px 0 -2px #f4ead4,0 7px 0 -2px #d8c7a3,0 12px 0 -4px #efe3c8,0 13px 0 -4px #d8c7a3,0 30px 44px rgba(80,55,20,.3)}
#nv[data-th="2"] .nvart{border-radius:10px;backdrop-filter:none;-webkit-backdrop-filter:none;background:#fffaf0 repeating-linear-gradient(180deg,transparent 0 33px,rgba(169,120,43,.06) 33px 34px)}
#nv[data-th="2"] .nvart::before{content:"";position:absolute;inset:9px;border:1px solid rgba(169,120,43,.35);border-radius:5px;pointer-events:none}
#nv[data-th="2"] .nvart>*{position:relative}
#nv[data-th="2"] .nvmd{right:4px;top:6px}
#nv[data-th="2"] .nvedw{border-top-style:solid}
/* Theme 3 — Midnight Gold (glass) */
#nv[data-th="3"]{--nvcard:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));--nvcb:rgba(232,194,122,.4);--nvsh:0 30px 70px rgba(0,0,0,.55),0 0 50px rgba(232,194,122,.1),inset 0 1px 0 rgba(255,255,255,.12)}
#nv[data-th="3"] .nvart{background:var(--nvcard)}
#nv[data-th="3"] .nvart::before{content:"";position:absolute;left:12%;right:12%;top:0;height:1px;background:linear-gradient(90deg,transparent,#f6dca0,transparent)}

/* settings sheet */

#nvSt.on{display:flex;animation:nvFade .2s}
@keyframes nvFade{from{opacity:0}to{opacity:1}}@keyframes nvUp{from{transform:translateY(40px)}to{transform:none}}
#nvSt .sh{width:100%;max-width:560px;margin:0 auto;background:#fff;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;animation:nvUp .28s ease;box-shadow:0 -10px 40px rgba(40,20,90,.25)}
#nvSt .gr{width:44px;height:5px;border-radius:3px;background:#ddd5f3;margin:4px auto 14px}
#nvSt .pv{height:66px;border-radius:12px;padding:9px 9px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;text-align:left;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07)}
#nvSt .pv b{font-size:18px;line-height:1;margin-bottom:3px}#nvSt .pv i{display:block;height:4px;border-radius:2px;opacity:.55}#nvSt .pv i+i{width:60%}
#nvSt .sh{padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0}
#nvSt .gr{margin:2px auto 8px}
#nvSt .nvhd{display:flex;align-items:center;justify-content:space-between;margin:0 2px 4px}
#nvSt .nvhd b{font:700 19px 'Playfair Display','Hind',serif;color:#2b2550}
#nvSt .nvhd button{width:32px;height:32px;border:0;border-radius:50%;background:#f3efff;display:flex;align-items:center;justify-content:center;cursor:pointer}
#nvSt .nvhd svg{width:15px;height:15px;fill:none;stroke:#6b5fa0;stroke-width:2.4;stroke-linecap:round}
#nvSt .nvlb{display:flex;align-items:center;gap:10px;margin:14px 2px 9px;font:700 10.5px 'Quicksand',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#8f84b3}
#nvSt .nvlb::after{content:'';flex:1;height:1px;background:#ece6fa}
#nvSt .nvths{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#nvSt .nvths button{position:relative;border:1.5px solid #ece6fa;background:#fff;padding:5px 5px 6px;cursor:pointer;border-radius:16px;text-align:center;font:700 11.5px 'Quicksand',sans-serif;color:#4a3f6b;-webkit-tap-highlight-color:transparent;transition:transform .12s}
#nvSt .nvths button:active{transform:scale(.97)}
#nvSt .nvths button span{display:block;margin:6px 0 1px}
#nvSt .nvths button.on{border-color:#7c5cf0;box-shadow:0 4px 14px rgba(124,92,240,.22)}
#nvSt .nvths button u{display:none;position:absolute;top:9px;right:9px;width:16px;height:16px;border-radius:50%;background:#7c5cf0;text-decoration:none}
#nvSt .nvths button u::after{content:'';position:absolute;left:5px;top:3px;width:4px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
#nvSt .nvths button.on u{display:block}
#nvSt .nvact{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#nvSt .nvact button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px 9px;border:1.5px solid #ece6fa;border-radius:16px;background:#faf8ff;color:#2b2550;font:600 11.5px 'Quicksand','Hind',sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s}
#nvSt .nvact button:active{transform:scale(.96);background:#f1ecff}
#nvSt .nvact button i{font-style:normal;font-size:17px;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(124,92,240,.18);display:flex;align-items:center;justify-content:center}
#nvSt .nvact button.on{border-color:#7c5cf0;background:#f1ecff;color:#6a47e0}
#nvSt .nvdel{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;padding:11px;border:0;border-radius:14px;background:#fdf0f3;color:#d9486b;font:600 13px 'Quicksand','Hind',sans-serif;cursor:pointer}
#nvSt .nvdel svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#nvSt .nvdel:active{background:#fbe0e7}
#nvSt .pv1{background:linear-gradient(180deg,#f5f0ff,#eff6ff)}#nvSt .pv1 b{color:#7c5cf0;font-family:'Quicksand',sans-serif}#nvSt .pv1 i{background:#7c5cf0}
#nvSt .pv2{background:linear-gradient(180deg,#f8f2e6,#efe3cc)}#nvSt .pv2 b{color:#a9782b;font-family:'Playfair Display',serif}#nvSt .pv2 i{background:#a9782b}
#nvSt .pv3{background:radial-gradient(circle at 80% 15%,#3a2d7a,transparent 60%),#0c0e22}#nvSt .pv3 b{color:#e8c27a;font-family:'Playfair Display',serif;font-style:italic}#nvSt .pv3 i{background:#e8c27a}

#nvLb{position:fixed;inset:0;z-index:95;background:rgba(10,8,24,.93);display:none;align-items:center;justify-content:center}
#nvLb.on{display:flex}#nvLb img{max-width:96vw;max-height:92vh;object-fit:contain;border-radius:10px}
</style>
</head>

async function sha(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p+uid));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

  if(lockMode==='set1'){tmpPin=p;lockMode='set2';$('lockT').textContent='PIN dobara daalein';return}
  if(lockMode==='set2'){if(p!==tmpPin){shake();lockMode='set1';$('lockT').textContent='Match nahi hua, naya PIN daalein';return}
    pinHash=await sha(p);db.ref(base()+'/pin').set(pinHash);closeLock();toast('PIN set ho gaya 🔒');if(view==='set')render();return}
  if(await sha(p)===pinHash){const cb=lockCb;closeLock();if(cb)cb()}else shake()}

  else await u.reauthenticateWithPopup(new firebase.auth.GoogleAuthProvider());
  pinHash=null;db.ref(base()+'/pin').remove();closeLock();toast('PIN hata diya, Settings se naya set karein')}catch(e){alert('Verify nahi hua: '+e.message)}}

const sorted=()=>Object.values(entries).sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));

const FEATHER='<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><path d="M16 8 2 22M17.5 15H9"/></svg>';

  $('main').innerHTML=`<div class="hero2"><div class="gr"><span class="gi">${ic}</span><b>${g},</b><span class="nm">${esc(name)}</span><span>✨</span></div><p>${PROMPTS[new Date().getDate()%PROMPTS.length]}</p></div>
  <div class="srchw"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input autocomplete="off" autocorrect="off" spellcheck="false" placeholder="diary mein khojein..." value="${esc(q)}" oninput="q=this.value.toLowerCase();renderList()"><span class="fil" onclick="toggleTags()"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></span></div>

function renderStats(){const a=Object.values(entries),s=streaks(),words=a.reduce((n,e)=>n+(e.text.trim()?e.text.trim().split(/\s+/).length:0),0);
  const mc={},tc={};a.forEach(e=>{if(e.mood)mc[e.mood]=(mc[e.mood]||0)+1;(e.tags||[]).forEach(t=>tc[t]=(tc[t]||0)+1)});

function pmDoSave(){const e=entries[pmId];if(!e)return pmClose();const v=!e.saved;e.saved=v;db.ref(base()+'/entries/'+pmId+'/saved').set(v?true:null).catch(x=>toast('Sync nahi hua: '+x.message));pmClose();toast(v?'Save ho gaya 🔖':'Unsave ho gaya');render()}
function pmDoDel(){const e=entries[pmId];if(!e)return pmClose();const id=pmId;if(!confirm('Ye page hamesha ke liye hata dein?'))return;delete entries[id];db.ref(base()+'/entries/'+id).remove();pmClose();toast('Page hata diya');render()}
document.addEventListener('touchstart',ev=>{const c=ev.target.closest&&ev.target.closest('.en2');if(!c)return;const t=ev.touches[0];lpX=t.clientX;lpY=t.clientY;clearTimeout(lpT);lpT=setTimeout(()=>{lpFired=true;c.classList.remove('lp');pmOpen(c.dataset.id)},500);c.classList.add('lp')},{passive:true});
document.addEventListener('touchmove',ev=>{const t=ev.touches[0];if(Math.abs(t.clientX-lpX)>10||Math.abs(t.clientY-lpY)>10){clearTimeout(lpT);document.querySelectorAll('.en2.lp').forEach(x=>x.classList.remove('lp'))}},{passive:true});
['touchend','touchcancel'].forEach(n=>document.addEventListener(n,()=>{clearTimeout(lpT);document.querySelectorAll('.en2.lp').forEach(x=>x.classList.remove('lp'))},{passive:true}));
document.addEventListener('contextmenu',ev=>{const c=ev.target.closest&&ev.target.closest('.en2');if(c){ev.preventDefault();if(!lpFired){lpFired=true;pmOpen(c.dataset.id)}}});
document.addEventListener('click',ev=>{if(lpFired&&ev.target.closest&&ev.target.closest('.en2')){ev.stopPropagation();ev.preventDefault()}lpFired=false},true);

/* ===== reading mode (book view) ===== */
const RDFS=[.88,1,1.14,1.3,1.5],RDTH=['paper','lav','night'],RDIC={paper:'📜',lav:'💜',night:'🌙'};
let rdP=(()=>{const d={th:'paper',fs:1,ord:'asc',fmt:true,flt:'all'};try{const o=JSON.parse(localStorage.getItem('rdPref')||'{}');return Object.assign(d,o,{th:RDTH.includes(o.th)?o.th:'paper',flt:['all','pin','sav'].includes(o.flt)?o.flt:'all'})}catch(_){return d}})();
function rdSaveP(){try{localStorage.setItem('rdPref',JSON.stringify(rdP))}catch(_){}}
function rdApply(){const r=$('rd');RDTH.forEach(t=>r.classList.toggle('t-'+t,t===rdP.th));r.style.setProperty('--rfs',RDFS[rdP.fs]||1);
  [...$('rdSz').children].forEach((b,i)=>b.classList.toggle('on',i===rdP.fs));
  [...$('rdTs').children].forEach((b,i)=>b.classList.toggle('on',RDTH[i]===rdP.th));
  const es=Object.values(entries),cn={all:es.length,pin:es.filter(e=>e.pinned).length,sav:es.filter(e=>e.saved).length};
  [...$('rdFl').children].forEach(b=>{const f=b.dataset.f;b.classList.toggle('on',f===rdP.flt);b.querySelector('em').textContent=cn[f]});
  $('rdFmS').classList.toggle('on',!!rdP.fmt);$('rdFmS').setAttribute('aria-checked',!!rdP.fmt)}
function rdPanel(f){const r=$('rd'),o=typeof f==='boolean'?f:!r.classList.contains('pn');r.classList.toggle('pn',o);$('rdSet').classList.toggle('on',o);$('rdSet').setAttribute('aria-expanded',o)}
function rdSetFl(f){rdP.flt=f;rdSaveP();rdApply();rdBuild();$('rdSc').scrollTo({top:0,behavior:'auto'})}
function rdSetTh(t){rdP.th=t;rdSaveP();rdApply()}
function rdSetFs(i){rdP.fs=i;rdSaveP();rdApply()}
function rdFmtT(){const sc=$('rdSc'),y=sc.scrollTop;rdP.fmt=!rdP.fmt;rdSaveP();rdApply();rdBuild();sc.scrollTo({top:y,behavior:'auto'})}
function rdOrder(){rdP.ord=rdP.ord==='asc'?'desc':'asc';rdSaveP();rdBuild();$('rdSc').scrollTo({top:0,behavior:'auto'});toast(rdP.ord==='asc'?'Oldest first':'Newest first')}
function rdJump(id){const el=document.getElementById(id),sc=$('rdSc');if(!el||!sc)return;const y=el.getBoundingClientRect().top-sc.getBoundingClientRect().top+sc.scrollTop-6;sc.scrollTo({top:Math.max(0,y),behavior:'smooth'})}
function rdScr(){const s=$('rdSc'),m=s.scrollHeight-s.clientHeight;$('rd').classList.toggle('rsd',s.scrollTop>700)}

/* --- standardise what the user wrote: keep bold/italic/underline/lists/headings, drop stray fonts, colours, sizes, alignment --- */
const RDBLK=/^(div|p|ul|ol|li|h[1-6]|blockquote|hr|table|pre|section|article)$/,rdEmpty=h=>!h.replace(/<br>|\s|&nbsp;/g,'').length&&!/<img/.test(h),rdTrim=h=>h.replace(/^(<br>)+|(<br>)+$/g,'');
function rdInl(n){
  if(n.nodeType===3)return esc(n.nodeValue.replace(/​/g,''));
  if(n.nodeType!==1)return'';
  const t=n.tagName.toLowerCase();
  if(t==='br')return'<br>';
  if(t==='img'){const s=n.getAttribute('src')||'';const d=n.dataset||{},wv=parseFloat(d.w)||parseFloat(n.style&&n.style.width)||0;let st='';if(wv)st='width:'+Math.min(100,wv)+'%;max-width:100%;height:auto;display:block;margin:8px auto;';const cl=+d.cl||0,ct=+d.ct||0,cr=+d.cr||0,cb=+d.cb||0;if((cl||ct||cr||cb||(+d.st&&Math.abs(+d.st-1)>.001))&&+d.ar)st+='aspect-ratio:'+(+d.ar)+';object-fit:fill;object-view-box:inset('+ct*100+'% '+cr*100+'% '+cb*100+'% '+cl*100+'%);';return /^(data:image|https?:)/i.test(s)?`<img src="${esc(s)}"${st?` style="${st}"`:''}>`:''}
  if(/^(script|style|iframe|object|embed|link|svg)$/.test(t))return'';
  let c='';n.childNodes.forEach(k=>{c+=rdInl(k)});
  if(!c)return'';
  const st=n.style||{},td=(st.textDecoration||'')+(st.textDecorationLine||'');
  if(t==='b'||t==='strong'||/^(bold|[6-9]00)$/.test(st.fontWeight||''))c=`<b>${c}</b>`;
  if(t==='i'||t==='em'||st.fontStyle==='italic')c=`<i>${c}</i>`;
  if(t==='u'||/underline/.test(td))c=`<u>${c}</u>`;
  if(t==='s'||t==='strike'||t==='del'||/line-through/.test(td))c=`<s>${c}</s>`;
  return c}
function rdBlocks(root,out){
  let buf='';const flush=()=>{const h=rdTrim(buf);if(!rdEmpty(h))out.push({t:'p',h});buf=''};
  root.childNodes.forEach(n=>{
    if(n.nodeType!==1){buf+=rdInl(n);return}
    const t=n.tagName.toLowerCase();
    if(!RDBLK.test(t)){buf+=rdInl(n);return}
    flush();
    if(t==='ul'||t==='ol'){const items=[];[...n.children].forEach(li=>{if(li.tagName.toLowerCase()!=='li')return;const h=rdTrim(rdInl(li));if(!rdEmpty(h))items.push(h)});if(items.length)out.push({t,items})}
    else if(/^h[1-6]$/.test(t)){const h=rdTrim(rdInl(n)).replace(/<\/?b>/g,'');if(!rdEmpty(h))out.push({t:'h',h})}
    else if(t==='blockquote'){const h=rdTrim(rdInl(n));if(!rdEmpty(h))out.push({t:'q',h})}
    else if(t==='hr')out.push({t:'hr'});
    else if([...n.children].some(c=>RDBLK.test(c.tagName.toLowerCase())))rdBlocks(n,out);
    else{const h=rdTrim(rdInl(n));if(!rdEmpty(h))out.push({t:'p',h,al:(n.style&&n.style.textAlign)||n.getAttribute('align')||''})}
  });
  flush()}
function rdTextBlocks(txt){const out=[];let cur=null;
  String(txt).split(/\r?\n/).forEach(l=>{const s=l.trim();if(!s){cur=null;return}
    const ub=s.match(/^[-•*·]\s+(.*)/),ob=s.match(/^\d+[.)]\s+(.*)/),k=ub?'ul':ob?'ol':null;
    if(k){if(!cur||cur.t!==k){cur={t:k,items:[]};out.push(cur)}cur.items.push(esc((ub||ob)[1]))}
    else{cur=null;out.push({t:'p',h:esc(s)})}});
  return out}
/* auto-format: display only (saved text is never changed) */
function rdFmt(h,tail){
  if(!rdP.fmt)return h;
  let start=true;
  let o=h.split(/(<[^>]+>)/).map(tk=>{
    if(!tk||tk[0]==='<')return tk;
    let t=tk.replace(/[ \t\u00a0]+/g,' ').replace(/ +([,?!।])/g,'$1').replace(/([,?!])(?=[A-Za-z\u0900-\u097F])/g,'$1 ');
    if(start&&/\p{L}/u.test(t)){t=t.replace(/^([^\p{L}\p{N}]*)([a-z])/u,(m,a,b)=>a+b.toUpperCase());start=false}
    t=t.replace(/([.?!।]\s+)([a-z])/g,(m,a,b)=>a+b.toUpperCase());
    return t});
  o=o.join('').replace(/(<br>)\s+/g,'$1');
  if(tail){const tx=o.replace(/<[^>]+>/g,'').trim();if(tx.length>24&&/[A-Za-z0-9)\u0029]$/.test(tx))o=o.replace(/((?:<\/[a-z]+>)*)$/,'.$1')}
  return o}
const rdTitle=t=>{t=String(t||'').trim();return esc(rdP.fmt?t.replace(/^([^\p{L}\p{N}]*)([a-z])/u,(m,a,b)=>a+b.toUpperCase()):t)};
function rdBody(e){let b=[];
  try{if(e.html&&String(e.html).trim()){rdBlocks(new DOMParser().parseFromString(String(e.html),'text/html').body,b)}}catch(_){b=[]}
  if(!b.length)b=rdTextBlocks(e.text||'');
  let h='',first=true;
  b.forEach((x,i)=>{
    const nx=b[i+1];
    if(x.t==='p'){const tx=x.h.replace(/<[^>]+>/g,'').trim();
      const boldOnly=/^<b>[^<]*<\/b>$/.test(x.h)&&tx.length<=80&&!/[.।]$/.test(tx);
      const lead=rdP.fmt&&tx.length<=60&&!/[.!?।,]$/.test(tx)&&nx&&(nx.t==='ul'||nx.t==='ol'||/:$/.test(tx));
      if(boldOnly||lead||(rdP.fmt&&/:$/.test(tx)&&tx.length<=70)){h+=`<h4>${rdFmt(x.h.replace(/<\/?b>/g,'')).replace(/:$/,'')}</h4>`}
      else{const c=(x.al==='center'&&tx.length<=70)?'ct':(first&&/^[A-Za-z]/i.test(tx)&&tx.length>140)?'dc':'';h+=`<p${c?` class="${c}"`:''}>${rdFmt(x.h,!c)}</p>`}}
    else if(x.t==='h')h+=`<h4>${rdFmt(x.h)}</h4>`;
    else if(x.t==='ul'||x.t==='ol')h+=`<${x.t}>${x.items.map(i=>`<li>${rdFmt(i)}</li>`).join('')}</${x.t}>`;
    else if(x.t==='q')h+=`<blockquote>${rdFmt(x.h)}</blockquote>`;
    else if(x.t==='hr')h+='<hr>';
    first=false});
  return h}
const rdWords=e=>(String(e.text||'').trim().match(/\S+/g)||[]).length;
function rdBuild(){
  const all=Object.values(entries).filter(e=>rdP.flt==='pin'?e.pinned:rdP.flt==='sav'?e.saved:true).sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0));
  if(!all.length){const m={pin:['📌','No pinned notes','Press and hold a note, then choose Pin'],sav:['🔖','No saved notes','Press and hold a note, then choose Save']}[rdP.flt]||['📖','Your diary is empty',''];$('rdBk').innerHTML=`<div class="rem"><i>${m[0]}</i><b>${m[1]}</b><small>${m[2]}</small></div>`;return}
  const pgN=new Map();all.forEach((e,i)=>pgN.set(e.id,i+1));
  const months=[];all.forEach(e=>{const k=e.date.slice(0,7);let m=months[months.length-1];if(!m||m.k!==k){m={k,list:[]};months.push(m)}m.list.push(e)});
  if(rdP.ord==='desc'){months.reverse();months.forEach(m=>m.list.reverse())}
  const name=(auth.currentUser&&(auth.currentUser.displayName||auth.currentUser.email.split('@')[0])||'').split(' ')[0];
  const fm=d=>new Date(d+'T00:00').toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'});
  const ml=k=>new Date(k+'-01T00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const nf=n=>n.toLocaleString('en-IN'),tw=all.reduce((n,e)=>n+rdWords(e),0),days=new Set(all.map(e=>e.date)).size;
  let h=`<section class="bkc"><div class="fr"><div><div class="mk">A Personal Journal</div><h1>My Diary</h1><div class="nm">${esc(name)}</div><div class="ln"></div><div class="st"><div><b>${nf(all.length)}</b><small>Pages</small></div><div><b>${nf(tw)}</b><small>Words</small></div><div><b>${nf(days)}</b><small>Days</small></div></div><div class="bkrg">${fm(all[0].date)} — ${fm(all[all.length-1].date)}</div></div></div></section>`;
  months.forEach((m,mi)=>{
    const mw=m.list.reduce((n,e)=>n+rdWords(e),0);
    h+=`<section><div class="bkm" id="m-${m.k}"><h2><span>✦</span>${ml(m.k)}<span>✦</span></h2></div>`;
    m.list.forEach(e=>{const d=new Date(e.date+'T00:00'),ph=(e.photos||[]).filter(Boolean),w=rdWords(e),tm=e.ts?new Date(e.ts).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'';
      h+=`<article class="bkp" id="p-${e.id}"><div class="bkh"><span class="bkd">${d.getDate()}</span><div class="bkw"><b>${d.toLocaleDateString('en-US',{weekday:'long'})}</b>${d.toLocaleDateString('en-US',{month:'long',year:'numeric'})}${tm?' · '+tm:''}</div>${e.mood?`<span class="bke">${e.mood}</span>`:''}</div>`
      +(e.title?`<h3>${rdTitle(e.title)}</h3>`:'')+`<div class="bkb">${rdBody(e)}</div>`
      +(ph.length?`<div class="bkf${ph.length>1?' bk2':''}">${ph.map(s=>`<img loading="lazy" src="${esc(s)}">`).join('')}</div>`:'')
      +((e.tags||[]).length?`<div class="bkg">${e.tags.map(t=>`<span>#${esc(t)}</span>`).join('')}</div>`:'')
      +`<div class="bkn"><span>Page ${pgN.get(e.id)}${w?` · ${nf(w)} words · ${Math.max(1,Math.ceil(w/180))} min read`:''}</span><button onclick="rdEdit('${e.id}')">✎ Edit</button></div><div class="bko">✦ ✦ ✦</div></article>`});
    h+='</section>'});
  h+=`<div class="bkz">~ ${rdP.ord==='asc'?'abhi tak ki kahani':'kahani ki shuruaat'} ~</div>`;
  $('rdBk').innerHTML=h}
function openReader(){if(!Object.keys(entries).length){toast('Diary abhi khali hai 🌸');return}
  rdApply();rdBuild();const r=$('rd');rdPanel(false);r.classList.add('on');document.documentElement.classList.add('ed-lock');$('rdSc').scrollTop=0;rdScr();history.pushState({rd:1},'')}
function rdHide(){rdPanel(false);$('rd').classList.remove('on');document.documentElement.classList.remove('ed-lock');$('rdBk').innerHTML=''}
function rdEdit(id){history.back();setTimeout(()=>openEd(id),80)}
</script>

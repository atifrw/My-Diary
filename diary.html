<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>🌙 My Diary</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Hind:wght@400;500;600&family=Quicksand:wght@500;600;700&family=Merriweather&family=Great+Vibes&family=Playfair+Display&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<style>
:root{--ink:#4a3f6b;--soft:#8f84b3;--pri:#a78bfa;--pk:#ffc8dd;--lil:#d9c8ff;--sky:#bde0fe;--mint:#c4f5d0;--pch:#ffe0b8;--glass:rgba(255,255,255,.66)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Quicksand','Hind',sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(165deg,#fde2f3,#e4d9ff 48%,#d3eaff) fixed}
button,input,textarea{font:inherit;color:inherit}
.blob{position:fixed;border-radius:50%;filter:blur(55px);opacity:.6;z-index:0;pointer-events:none;animation:fl 16s ease-in-out infinite alternate}
.b1{width:260px;height:260px;background:var(--pk);top:-60px;left:-60px}.b2{width:300px;height:300px;background:var(--sky);bottom:5%;right:-90px;animation-delay:-5s}.b3{width:200px;height:200px;background:var(--pch);top:40%;left:-70px;animation-delay:-9s}
@keyframes fl{to{transform:translate(30px,-40px) scale(1.15)}}
@media(prefers-reduced-motion:reduce){.blob{animation:none}}
#loader,#auth,#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;background:linear-gradient(165deg,#fde2f3,#e4d9ff 48%,#d3eaff)}
#loader{z-index:70;font-size:54px}#loader span{animation:pu 1.2s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.15);opacity:.6}}
#auth{display:none;z-index:40}#lock{display:none;z-index:60;flex-direction:column;gap:14px}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.85);border-radius:26px;box-shadow:0 10px 34px rgba(150,120,200,.16)}
.login{width:min(380px,90%);padding:28px 24px;text-align:center}
.hand{font-family:'Caveat',cursive;font-weight:700}
.login h1{font-size:44px;margin:4px 0 14px;line-height:1}
.in{width:100%;padding:13px 14px;border-radius:16px;border:1.5px solid #e7def8;background:#fff;margin-bottom:10px;outline:none}
.in:focus{border-color:var(--pri)}
.btn{border:none;cursor:pointer;border-radius:16px;padding:13px 18px;font-weight:700;background:linear-gradient(135deg,#c4b5fd,#f9a8d4);color:#fff;width:100%;box-shadow:0 6px 16px rgba(167,139,250,.35)}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06);border:1.5px solid #e7def8}
.btn.red{background:#fff;color:#d9486b;border:1.5px solid #ffd1dc;box-shadow:none}
#app{display:none;position:relative;z-index:1;max-width:640px;margin:0 auto;padding:18px 14px 120px}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:4px 4px 14px}
.top h1{margin:0;font-size:38px;line-height:1}.top small{color:var(--soft);font-weight:600}
.hero{padding:18px 18px 16px;margin-bottom:14px;position:relative;overflow:hidden}
.hero .hi{font-size:30px;line-height:1.1}.hero p{margin:6px 0 0;color:var(--soft);font-size:14.5px;line-height:1.5}
.stk{position:absolute;right:14px;top:12px;text-align:center;background:linear-gradient(135deg,var(--pch),var(--pk));border-radius:20px;padding:8px 12px;font-weight:700}
.stk b{font-size:22px;display:block;line-height:1}.stk small{font-size:11px}
.srch{margin-bottom:10px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1.5px solid #e7def8;background:#ffffffaa;border-radius:20px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.en{display:flex;gap:12px;padding:14px 14px 14px 0;margin-bottom:12px;cursor:pointer;overflow:hidden;align-items:stretch}
.en .tab{width:9px;border-radius:0 8px 8px 0;flex-shrink:0}
.dt{text-align:center;min-width:44px;line-height:1}.dt b{font-size:28px;font-family:'Caveat',cursive}.dt small{display:block;font-size:12px;color:var(--soft);margin-top:2px}
.bd{flex:1;min-width:0}.tt{font-weight:700;font-size:16px}.sn{color:#6c628f;font-size:14px;margin:3px 0 6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tg span{display:inline-block;font-size:11.5px;background:#ffffffcc;border-radius:10px;padding:2px 8px;margin:0 4px 3px 0;color:var(--soft);font-weight:600}
.en img{width:62px;height:62px;object-fit:cover;border-radius:16px;align-self:center;transform:rotate(3deg);border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.1)}
.empty{text-align:center;color:var(--soft);padding:34px 10px;line-height:1.7}.empty .big{font-size:46px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(420px,92%);z-index:20;display:flex;justify-content:space-around;align-items:center;padding:8px 10px}
nav button{border:none;background:none;font-size:23px;padding:8px 12px;border-radius:16px;cursor:pointer;opacity:.5}nav button.on{opacity:1;background:#ffffffb0}
nav .fab{width:58px;height:58px;border-radius:50%;margin-top:-30px;font-size:26px;opacity:1;background:linear-gradient(135deg,#c4b5fd,#f9a8d4);box-shadow:0 8px 20px rgba(167,139,250,.5);color:#fff}
.cn{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.cn b{font-size:17px}
.cn button{border:none;background:#fff;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.cg small{color:var(--soft);font-size:11.5px;font-weight:600;padding:4px 0}
.cd{border:none;background:#ffffff80;border-radius:14px;aspect-ratio:1;font-size:13px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.cd span{font-size:15px;min-height:16px}.cd.has{background:#fff}.cd.today{outline:2px solid var(--pri)}.cd.sel{background:var(--lil)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.sc{padding:16px;text-align:center}.sc b{font-family:'Caveat',cursive;font-size:38px;display:block;line-height:1}.sc small{color:var(--soft);font-weight:600}
.bar{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13.5px;font-weight:600}.bar i{display:block;height:12px;border-radius:8px;min-width:6px}
.set{padding:16px;margin-bottom:12px}.set h3{margin:0 0 10px}.set .btn{margin-top:8px}
#ed{position:fixed;inset:0;z-index:45;background:linear-gradient(165deg,#fff1f8,#efe8ff 50%,#e6f3ff);display:none;flex-direction:column;--tx:#4a3f6b}
#ed.dark{--tx:#f5f3ff}
.edh{display:flex;align-items:center;gap:8px;padding:12px 14px}
.ib{border:none;background:#ffffffb0;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer;color:#4a3f6b}
.sv{border:none;background:linear-gradient(135deg,#c4b5fd,#f9a8d4);color:#fff;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer}
#mnu,#mdPop{display:none;position:absolute;right:0;top:46px;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(80,60,140,.25);z-index:5;padding:8px}
#mnu button{display:block;border:none;background:none;padding:10px 14px;text-align:left;white-space:nowrap;cursor:pointer;font-weight:600;width:100%;color:#4a3f6b}
#mdPop{width:262px;grid-template-columns:repeat(5,1fr);gap:6px}
#mdPop button{border:none;background:#f6f1ff;border-radius:50%;width:42px;height:42px;font-size:23px;cursor:pointer}
.edb{flex:1;overflow-y:auto;padding:0 18px 12px;max-width:640px;width:100%;margin:0 auto}
.drow{display:flex;justify-content:space-between;align-items:center;position:relative}
#dBig{font-size:15px;font-weight:700;color:var(--tx);cursor:pointer}
#dBig b{font-family:'Caveat',cursive;font-size:46px;font-weight:700}
#edDate{position:absolute;left:0;top:30px;opacity:0;width:1px;height:1px;pointer-events:none}
.md{border:none;background:#ffffffb0;border-radius:50%;width:46px;height:46px;font-size:27px;cursor:pointer}
.ttl{width:100%;border:none;background:transparent;font-family:'Caveat',cursive;font-weight:700;font-size:34px;outline:none;padding:4px 0;color:var(--tx)}
.txt{width:100%;min-height:40vh;outline:none;font-size:17px;line-height:1.7;color:var(--tx);word-break:break-word}
.txt:empty:before{content:attr(data-ph);color:#a79dc9}
.txt h1{font-size:30px;margin:6px 0}.txt h2{font-size:26px;margin:6px 0}.txt h3{font-size:22px;margin:6px 0}.txt h4{font-size:19px;margin:6px 0}.txt h5{font-size:17px;margin:6px 0}
.txt ul,.txt ol{padding-left:26px;margin:4px 0}
.ph{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.ph div{position:relative}.ph img{width:84px;height:84px;object-fit:cover;border-radius:16px;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.1)}
.ph button{position:absolute;top:-6px;right:-6px;border:none;background:#d9486b;color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer}
.pill{display:flex;justify-content:space-around;margin:6px auto calc(12px + env(safe-area-inset-bottom,0px));width:min(430px,94%);background:#fff;border-radius:18px;padding:6px;box-shadow:0 8px 24px rgba(100,80,160,.22)}
.pb{border:none;background:none;font-size:21px;padding:9px 10px;border-radius:12px;cursor:pointer;color:#4a3f6b}.pb.on{background:var(--lil)}
#sheet{display:none;position:absolute;left:0;right:0;bottom:0;max-height:52vh;overflow-y:auto;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(80,60,140,.2);padding:0 14px 16px;z-index:6;color:#4a3f6b}
.sht{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;position:sticky;top:0;background:#fff;font-weight:700}
.sht button{border:none;background:none;font-size:22px;cursor:pointer;color:var(--pri)}
.rw{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sb{border:1.5px solid #ece4fb;background:#f8f5ff;border-radius:12px;padding:11px 14px;font-size:15px;cursor:pointer;color:#4a3f6b;min-width:48px}
.fg,.lg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ddd;cursor:pointer;display:inline-block}
.bgs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.bgs i{aspect-ratio:3/4;border-radius:12px;border:2px solid #e7def8;cursor:pointer}
.dots{display:flex;gap:14px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pri)}.dots i.on{background:var(--pri)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}.pad button{height:72px;border-radius:50%;border:none;background:#ffffffcc;font-size:24px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(150,120,200,.15)}
.sh{animation:sk .35s}@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.link{background:none;border:none;color:var(--soft);cursor:pointer;font-weight:600;text-decoration:underline}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-90px);background:#4a3f6b;color:#fff;padding:10px 18px;border-radius:20px;z-index:99;transition:.35s;font-size:14px;font-weight:600}#toast.on{transform:translateX(-50%) translateY(0)}
#print{display:none}
@media print{body{background:#fff}#app,.blob,nav,#ed,#toast{display:none!important}#print{display:block;color:#000;font-family:'Hind',sans-serif}.pe{page-break-inside:avoid;margin-bottom:22px;border-bottom:1px solid #ccc;padding-bottom:12px}.pe img{max-width:220px;margin:6px 6px 0 0;border-radius:8px}}
#ed{background:linear-gradient(165deg,#f7f8ff,#eef1ff 55%,#f3efff);--tx:#2b3563;padding:0 12px calc(4px + env(safe-area-inset-bottom,0px))}
.top2{position:relative;z-index:8;display:flex;align-items:center;gap:8px;margin:calc(12px + env(safe-area-inset-top,0px)) 4px 10px}
.dw2{position:relative;flex:1;min-width:0}
#dBig{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--tx);cursor:pointer;white-space:nowrap}
#dBig svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
#dBig i{font-style:normal;font-size:12px}
.ib2{border:none;background:rgba(255,255,255,.8);width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--tx);padding:0}
.svp{border:none;cursor:pointer;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:20px;background:linear-gradient(135deg,#9a9bfa,#7c7df0);box-shadow:0 8px 20px rgba(124,125,240,.35)}
.svp svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linejoin:round}
.svp i{font-style:normal;font-size:18px;line-height:1}
.tbar{position:relative;z-index:7;display:flex;align-items:center;gap:8px;background:rgba(228,232,250,.8);border:1px solid rgba(255,255,255,.9);border-radius:18px;padding:4px 8px 4px 16px;margin:0 0 12px}
.ttl2{flex:1;min-width:0;border:none;background:transparent;font-family:'Caveat','Hind',cursive;font-weight:700;font-size:34px;color:var(--tx);outline:none;padding:6px 0}
.ttl2::placeholder{color:#8f97c4}
.mdb{border:none;background:rgba(255,255,255,.85);width:42px;height:42px;border-radius:50%;font-size:24px;cursor:pointer;flex-shrink:0;padding:0}.mdb.none{opacity:.6;filter:grayscale(.6)}
.tbar #mdPop{right:6px;left:auto;top:58px}
.paper{position:relative;flex:1;min-height:0;background:rgba(255,255,255,.9);border:1px solid #e3e7f7;border-radius:20px;box-shadow:0 6px 24px rgba(120,130,200,.12);overflow:hidden}
.paper::after{content:'';position:absolute;left:0;right:0;bottom:0;height:210px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20400%20200%27%3E%3Ccircle%20cx%3D%2785%27%20cy%3D%2762%27%20r%3D%2730%27%20fill%3D%27%23eceffc%27/%3E%3Cpath%20d%3D%27M190%2054q6-6%2012%200M206%2068q6-6%2012%200M224%2050q5-5%2010%200%27%20stroke%3D%27%23b9c2ee%27%20stroke-width%3D%272%27%20fill%3D%27none%27%20stroke-linecap%3D%27round%27/%3E%3Cpath%20d%3D%27M0%20200V122L60%2086%20130%20130%20210%20114%20330%20162%20400%20172V200Z%27%20fill%3D%27%23e8ebfb%27/%3E%3Cpath%20d%3D%27M0%20200V152L50%20127%20120%20162%20220%20152%20400%20192V200Z%27%20fill%3D%27%23dde2f8%27/%3E%3Cg%20fill%3D%27%23c9d0f0%27%3E%3Cpath%20d%3D%27M14%20200l12-48%2012%2048zM38%20200l10-38%2010%2038zM62%20200l12-44%2012%2044zM90%20200l9-30%209%2030zM112%20200l8-24%208%2024z%27/%3E%3C/g%3E%3C/svg%3E") no-repeat left bottom/100% auto;pointer-events:none;z-index:0}
.psc{position:absolute;inset:0;overflow-y:auto;padding:16px 18px 60px;z-index:1}
.txt{font-family:'Quicksand','Hind',sans-serif;font-size:19px;line-height:1.7;min-height:60%;color:var(--tx)}
#ed.dark .paper{background:rgba(24,22,48,.6);border-color:rgba(255,255,255,.12)}
#ed.dark .tbar{background:rgba(255,255,255,.1)}
#ed.dark .ib2,#ed.dark .mdb{background:rgba(255,255,255,.18)}
.blob{animation:none!important}body.editing .blob,body.editing nav{display:none!important}
.sht .shx{width:34px;height:34px;border-radius:50%;background:#f1ecfb;color:#4a3f6b;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0}
.lb{font-size:12px;color:#8f97c4;font-weight:700;margin:6px 2px 6px;letter-spacing:.3px}
.sb.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sw.on{box-shadow:0 0 0 3px var(--pri)}
.bgs i.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri)}
.stp{align-items:center}.vv{min-width:44px;text-align:center;font-size:16px;color:#4a3f6b}
#sheet{max-height:58vh}
.txt:empty:before{font-family:'Caveat','Hind',cursive;font-size:23px}
.txt h1{font-size:34px}.txt h2{font-size:30px}.txt h3{font-size:26px}.txt h4{font-size:22px}.txt h5{font-size:20px}
.txt{position:relative}.txt:empty:before,.txt.emp:before{content:attr(data-ph);color:#a79dc9;font-family:'Caveat','Hind',cursive;font-size:23px;position:absolute;left:0;top:0;pointer-events:none}

/* compact tool sheet */
#sheet{max-height:44vh;padding:0 12px 8px}
.sht{padding:6px 4px;font-size:14px}
.sht .shx{width:28px;height:28px;font-size:13px}
.sb{padding:7px 0;font-size:14px;min-width:0;border-radius:10px}
.rw{gap:5px;margin-bottom:6px;flex-wrap:nowrap;align-items:center}
.rw>.sb{flex:1 1 0}
.rw.stp .vv{flex:0 0 32px;min-width:0;font-size:14px}
.sw{width:22px;height:22px;flex:0 0 auto}
.rw.sws{justify-content:space-between;padding:0 2px}
.rw.scr{overflow-x:auto;scrollbar-width:none}.rw.scr::-webkit-scrollbar{display:none}
.rw.scr>.sb{flex:0 0 auto;padding:7px 12px}
.lb{margin:2px 2px 4px;font-size:11px}
.lg{gap:5px}.lg .sb{padding:8px 0}

/* modern tabbed tool sheet */
#sheet{max-height:40vh;padding:0 14px 10px}
.tb{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px 12px;padding:2px}
.tb::-webkit-scrollbar{display:none}
.tb button{flex:0 0 auto;border:none;background:#f3effc;color:#8f84b3;border-radius:999px;padding:9px 18px;font-weight:700;font-size:13.5px;cursor:pointer}
.tb button.on{background:linear-gradient(135deg,#a78bfa,#818cf8);color:#fff;box-shadow:0 4px 12px rgba(129,140,248,.4)}
.pn .rw{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:10px;padding:4px 2px 8px;margin:0 -2px;scrollbar-width:none;scroll-snap-type:x proximity;align-items:center}
.pn .rw::-webkit-scrollbar{display:none}
.pn .rw>.sb{flex:0 0 auto;width:48px;height:46px;padding:0;border-radius:15px;font-size:16px;scroll-snap-align:start;display:flex;align-items:center;justify-content:center}
.pn .rw.scr>.sb{width:auto;padding:0 20px;font-size:16px}
.pn .vv{flex:0 0 38px;min-width:0;text-align:center;font-weight:700;font-size:15px}
.pn .sw{width:36px;height:36px;flex:0 0 auto;border-width:3px;scroll-snap-align:start}

<script>
firebase.initializeApp({apiKey:"AIzaSyB2DOFle2acosBfn-cSFbzEkbRWL1ld-3I",authDomain:"mydiary-07.firebaseapp.com",databaseURL:"https://mydiary-07-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"mydiary-07",storageBucket:"mydiary-07.firebasestorage.app",messagingSenderId:"497367240656",appId:"1:497367240656:web:770bd253222aa3a9b0f3d5"});
const auth=firebase.auth(),db=firebase.database();
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MOODS=[['😐','ठीक','#ffd6a5'],['😊','खुश','#ffe9a8'],['😁','बहुत खुश','#fff1a0'],['🥰','प्यार','#ffc8dd'],['😌','शांत','#c4f5d0'],['😟','चिंता','#e2e2ea'],['😡','गुस्सा','#ffb8b8'],['😔','उदास','#bde0fe'],['😞','निराश','#d9c8ff'],['😭','रोना','#b8f0ea']];
const PROMPTS=['आज किस बात ने मुस्कुराने पर मजबूर किया?','आज तुमने खुद के लिए क्या किया?','किस इंसान की याद आज आई?','आज की सबसे छोटी लेकिन खास बात क्या थी?','अगर आज को एक नाम दो तो क्या होगा?','कल के लिए तुम्हारी एक उम्मीद क्या है?'];
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
let uid,entries={},pinHash=null,view='home',calM=new Date(),selDay=null,tagF=null,q='',cur=null,photos=[],mood='';
let pinBuf='',lockMode='unlock',lockCb=null,tmpPin='',hiddenAt=0;
const base=()=>'users/'+uid+'/diary';

/* ---------- AUTH ---------- */
function googleLogin(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>alert('Login Failed: '+e.message))}
function emailLogin(){const e=$('em').value,p=$('pw').value;if(!e||!p)return alert('Email aur Password dono bhariye');
  auth.signInWithEmailAndPassword(e,p).catch(er=>{if(['auth/user-not-found','auth/invalid-credential'].includes(er.code)||er.message.includes('INVALID_LOGIN'))auth.createUserWithEmailAndPassword(e,p).then(()=>alert('Account ban gaya! Yehi aapka password hai.')).catch(x=>alert(x.message));else alert(er.message)})}
function forgotPw(){const e=$('em').value;if(!e)return alert('Pehle Gmail ID likhein.');auth.sendPasswordResetEmail(e).then(()=>alert('Reset link bhej diya gaya.')).catch(x=>alert(x.message))}
auth.onAuthStateChanged(u=>{$('loader').style.display='none';
  if(!u){uid=null;$('auth').style.display='flex';$('app').style.display='none';$('nav').style.display='none';return}
  if(uid===u.uid)return;uid=u.uid;
  db.ref(base()).once('value').then(s=>{const v=s.val()||{};entries=v.entries||{};Object.keys(entries).forEach(k=>entries[k].id=k);pinHash=v.pin||null;
    $('auth').style.display='none';$('app').style.display='block';$('nav').style.display='flex';
    
    go('home');if(pinHash)openLock('unlock',null,'PIN daalein',false)}).catch(e=>{alert('Access nahi mila: '+e.message+'. Sahi Gmail se Google login karein.');auth.signOut().then(()=>location.reload())})});

/* ---------- PIN LOCK ---------- */
$('pad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button onclick="key('${k==='⌫'?'b':k}')">${k}</button>`).join('');
function dots(){$('dots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?'on':''}"></i>`).join('')}
function openLock(mode,cb,title,cancel){lockMode=mode;lockCb=cb;pinBuf='';$('lockT').textContent=title;$('lockX').style.display=cancel?'block':'none';$('lockF').style.display=mode==='unlock'?'block':'none';$('lock').style.display='flex';dots()}
function closeLock(){$('lock').style.display='none';pinBuf=''}
function key(k){if(k==='b')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;dots();if(pinBuf.length===4)setTimeout(pinDone,140)}
async function sha(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p+uid));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function shake(){$('dots').classList.add('sh');setTimeout(()=>$('dots').classList.remove('sh'),400)}
async function pinDone(){const p=pinBuf;pinBuf='';dots();
  if(lockMode==='set1'){tmpPin=p;lockMode='set2';$('lockT').textContent='PIN dobara daalein';return}
  if(lockMode==='set2'){if(p!==tmpPin){shake();lockMode='set1';$('lockT').textContent='Match nahi hua, naya PIN daalein';return}
    pinHash=await sha(p);db.ref(base()+'/pin').set(pinHash);closeLock();toast('PIN set ho gaya 🔒');if(view==='set')render();return}
  if(await sha(p)===pinHash){const cb=lockCb;closeLock();if(cb)cb()}else shake()}
async function forgotPin(){try{const u=auth.currentUser;
  if(u.providerData[0].providerId==='password'){const p=prompt('PIN reset ke liye account ka password likhein:');if(!p)return;await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,p))}
  else await u.reauthenticateWithPopup(new firebase.auth.GoogleAuthProvider());
  pinHash=null;db.ref(base()+'/pin').remove();closeLock();toast('PIN hata diya, Settings se naya set karein')}catch(e){alert('Verify nahi hua: '+e.message)}}
function setPin(){openLock('set1',null,'Naya 4-digit PIN daalein',true)}
function changePin(){openLock('verify',()=>setPin(),'Purana PIN daalein',true)}
function removePin(){openLock('verify',()=>{pinHash=null;db.ref(base()+'/pin').remove();toast('PIN hata diya');render()},'PIN daalein',true)}

function go(v){view=v;document.querySelectorAll('nav button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render();window.scrollTo(0,0)}

  const r=document.createRange();r.setStart(node,off);r.setEnd(n,n.childNodes.length);const tail=r.extractContents(),z=document.createTextNode('\u200b');
  let inner=z;if(!strip)chain.forEach(c=>{const k=c.cloneNode(false);k.appendChild(inner);inner=k});
  n.after(inner);
  if(tail.textContent.replace(/\u200b/g,'').length){const t=n.cloneNode(false);t.appendChild(tail);inner.after(t)}
  if(!n.textContent.replace(/\u200b/g,'').length&&!n.querySelector('img,br'))n.remove();
  putCaret(z,1);return true}

function decoAt(el,line,tags){const E=$('edText');while(el&&el!==E){if(tags.test(el.tagName)||(getComputedStyle(el).textDecorationLine||'').includes(line))return true;el=el.parentElement}return false}
function fmtAt(k){const el=curEl(),cs=getComputedStyle(el);
  if(k==='bold')return parseInt(cs.fontWeight)>=600;if(k==='italic')return cs.fontStyle==='italic';
  return k==='underline'?decoAt(el,'underline',/^(U|INS)$/):decoAt(el,'line-through',/^(S|STRIKE|DEL)$/)}
function hlAt(el){const E=$('edText');while(el&&el!==E){const bg=getComputedStyle(el).backgroundColor;if(rgb2hex(bg)!=='')return bg;el=el.parentElement}return ''}

/* caret par poori format state */
function caretF(){const sel=getSelection();
  if(lastCaret&&lastCaret.node.isConnected&&sel.rangeCount&&sel.anchorNode===lastCaret.node&&zOnly(lastCaret.node))return Object.assign({},lastCaret.f);
  const el=curEl(),cs=getComputedStyle(el);
  return{bold:fmtAt('bold'),italic:fmtAt('italic'),underline:fmtAt('underline'),strike:fmtAt('strike'),color:rgb2hex(cs.color)||DEF_COL,size:Math.round(parseFloat(cs.fontSize))||DEF_SIZE,hl:rgb2hex(hlAt(el))}}

/* caret ke liye naya wrapper poori state se banao */
function rebuild(f){const E=$('edText');if(!getSelection().rangeCount)return;
  let n=getSelection().anchorNode;n=n.nodeType===3?n.parentElement:n;
  if(n!==E&&!BLKRE.test(n.tagName))stepOut(e=>e.parentElement===E||BLKRE.test(e.parentElement.tagName),true);
  const a=getSelection().anchorNode;let blk=a.nodeType===3?a.parentElement:a;const bs=getComputedStyle(blk);
  const isB=parseInt(bs.fontWeight)>=600,isI=bs.fontStyle==='italic';
  let root=null,leaf=null;const add=el=>{if(leaf)leaf.appendChild(el);else root=el;leaf=el};
  if(f.bold&&!isB)add(document.createElement('b'));
  if(f.italic&&!isI)add(document.createElement('i'));
  if(f.underline)add(document.createElement('u'));
  if(f.strike)add(document.createElement('s'));
  const sp=document.createElement('span');let need=false;
  if(!f.bold&&isB){sp.style.fontWeight='400';need=true}
  if(!f.italic&&isI){sp.style.fontStyle='normal';need=true}
  if(f.color&&f.color!==rgb2hex(bs.color)){sp.style.color=f.color;need=true}
  if(f.size&&f.size!==Math.round(parseFloat(bs.fontSize))){sp.style.fontSize=f.size+'px';need=true}
  if(f.hl){sp.style.backgroundColor=f.hl;need=true}
  if(need)add(sp);
  const z=document.createTextNode('\u200b');
  if(!leaf){
    if(a.nodeType===3&&zOnly(a)){putCaret(a,a.length);lastCaret={node:a,f};return}
    getSelection().getRangeAt(0).insertNode(z)}
  else{leaf.appendChild(z);getSelection().getRangeAt(0).insertNode(root)}
  putCaret(z,1);lastCaret={node:z,f}}

function togFmt(k){rs();if(titleFocus){titleFmt(k);return}
  if(!coll()){ex(FEX[k]);return}
  const f=caretF();f[k]=!f[k];rebuild(f);touch();refreshSheet()}

function st(){if(titleFocus)return stTitle();const el=curEl(),cs=getComputedStyle(el),c=coll(),F=c?caretF():null;
  return{bold:c?F.bold:qs('bold'),italic:c?F.italic:qs('italic'),underline:c?F.underline:qs('underline'),strike:c?F.strike:qs('strikeThrough'),
  jl:qs('justifyLeft'),jc:qs('justifyCenter'),jr:qs('justifyRight'),jf:qs('justifyFull'),block:qv('formatBlock').toLowerCase().replace(/[<>]/g,''),
  color:c?F.color:cs.color,hl:c?F.hl:hlAt(el),font:cs.fontFamily.replace(/["']/g,'').split(',')[0].trim().toLowerCase(),
  size:c?F.size:(Math.round(parseFloat(cs.fontSize))||0),lst:listSym()}}

function setCol(c){rs();if(titleFocus){tst.col=(rgb2hex(getComputedStyle($('edTitle')).color)===c)?'':c;applyTs();touch();refreshSheet();return}
  if(coll()){const f=caretF(),base=rgb2hex(getComputedStyle($('edText')).color)||DEF_COL;f.color=(f.color===c)?base:c;rebuild(f);touch();refreshSheet();return}
  ex('foreColor',rgb2hex(st().color)===c?DEF_COL:c)}

function setHl(c){rs();if(titleFocus){tst.hl=(!c||tst.hl===c)?'':c;applyTs();touch();refreshSheet();return}
  if(coll()){const f=caretF();f.hl=(!c||f.hl===c)?'':c;rebuild(f);touch();refreshSheet();return}
  const off=!c||rgb2hex(st().hl)===c;ex('hiliteColor',off?'transparent':c)}

function setSize(px){rs();if(titleFocus){tst.size=px;applyTs();touch();refreshSheet();return}const sel=getSelection();if(!sel.rangeCount)return;
  if(coll()){const f=caretF();f.size=px;rebuild(f);touch();refreshSheet();return}
  document.execCommand('styleWithCSS',false,true);document.execCommand('fontSize',false,'7');const E=$('edText');
  E.querySelectorAll('font[size="7"]').forEach(f=>{f.removeAttribute('size');f.style.fontSize=px+'px'});E.querySelectorAll('span').forEach(sp=>{if(sp.style.fontSize==='xxx-large')sp.style.fontSize=px+'px'});
  touch();refreshSheet()}

function phCheck(){const E=$('edText');E.classList.toggle('emp',!E.textContent.replace(/\u200b/g,'').length&&!E.querySelector('img,li,hr'))}
function openSheet(t){const b=$('shB'),m='onmousedown="event.preventDefault()"';$('sheet').style.display='block';tools();
  const B=(k,v,lab,act,x)=>`<button class="sb" data-k="${k}" data-v="${v}" ${m} onclick="${act}" ${x||''}>${lab}</button>`,L=x=>`<div class="lb">${x}</div>`;
  if(t==='font'){$('shT').textContent='Text style';
    const dv='<span class="dv"></span>';
    const TABS=[['style','Aa  Style'],['para','¶  Paragraph'],['col','🎨  Colour'],['font','Font']];
    b.innerHTML=`<div class="tb">${TABS.map(x=>`<button ${m} data-t="${x[0]}" onclick="shTabGo('${x[0]}')">${x[1]}</button>`).join('')}</div>`
    +`<div class="pn" data-p="style"><div class="rw">${B('fmt','bold','<b>B</b>',"togFmt('bold')")}${B('fmt','italic','<i>I</i>',"togFmt('italic')")}${B('fmt','underline','<u>U</u>',"togFmt('underline')")}${B('fmt','strike','<s>S</s>',"togFmt('strike')")}${dv}<button class="sb" ${m} onclick="stepSize(-2)">A−</button><b id="szV" class="vv"></b><button class="sb" ${m} onclick="stepSize(2)">A+</button>${dv}<button class="sb" ${m} onclick="clr()">Tx</button><button class="sb" ${m} onclick="ex('undo')">↶</button><button class="sb" ${m} onclick="ex('redo')">↷</button></div></div>`
    +`<div class="pn" data-p="para"><div class="rw">${[['⬅','jl','justifyLeft'],['↔','jc','justifyCenter'],['➡','jr','justifyRight'],['☰','jf','justifyFull']].map(x=>B('fmt',x[1],x[0],`setAl('${x[2]}','${x[1]}')`)).join('')}${dv}<button class="sb" ${m} onclick="setLh(-.3)">↕−</button><b id="lhV" class="vv"></b><button class="sb" ${m} onclick="setLh(.3)">↕+</button>${dv}${B('blk','div','¶',"setBlk('div')")}${[1,2,3,4,5].map(i=>B('blk','h'+i,'H'+i,`setBlk('h${i}')`)).join('')}</div></div>`
    +`<div class="pn" data-p="col">${L('Text colour')}<div class="rw">${COLS.map(c=>`<i class="sw" data-k="col" data-v="${c}" style="background:${c}" ${m} onclick="setCol('${c}')"></i>`).join('')}</div>${L('Highlight')}<div class="rw">${HL.map(c=>`<i class="sw" data-k="hl" data-v="${c}" style="background:${c||'repeating-linear-gradient(45deg,#fff 0 5px,#e5e5e5 5px 10px)'}" ${m} onclick="setHl('${c}')"></i>`).join('')}</div></div>`
    +`<div class="pn" data-p="font"><div class="rw scr">${FONTS.map(f=>B('fnt',f[1],f[0],`setFont('${f[1]}')`,`style="font-family:'${f[1]}'"`)).join('')}</div></div>`;
    shTabGo(shTab)}
  else if(t==='list'){$('shT').textContent='List';b.innerHTML=`<div class="lg">${LISTS.map(l=>B('lst',l[1],l[0],`setList('${l[1]}')`)).join('')}</div><div class="rw" style="margin-top:10px"><button class="sb" ${m} onclick="noList()">✕ List hatayein</button></div>`}
  else if(t==='bg'){$('shT').textContent='Background';b.innerHTML=`<div class="bgs">${BGS.map((c,i)=>`<i data-k="bg" data-v="${i}" style="background:${c||'linear-gradient(165deg,#f7f8ff,#eef1ff 55%,#f3efff)'}" onclick="bg=BGS[${i}];applyBg();touch();refreshSheet()"></i>`).join('')}</div>`}
  else{$('shT').textContent='Emoji';b.innerHTML=`<div class="lg" style="grid-template-columns:repeat(6,1fr)">${EMO.map(e=>`<button class="sb" ${m} onclick="ex('insertText','${e}')">${e}</button>`).join('')}</div>`}
  refreshSheet()}
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Is browser mein voice typing nahi hai');
  if(rec){rec.stop();return}rec=new R();rec.lang='hi-IN';rec.continuous=true;rec.interimResults=false;
  rec.onresult=e=>{const t=e.results[e.results.length-1][0].transcript;rs();document.execCommand('insertText',false,t+' ')};
  rec.onend=()=>{rec=null;$('micB').classList.remove('on')};rec.start();$('micB').classList.add('on');toast('Bolna shuru karein 🎤')}
function copyTxt(){navigator.clipboard&&navigator.clipboard.writeText($('edText').innerText.replace(/\u200b/g,'')).then(()=>toast('Text copy ho gaya'));$('mnu').style.display='none'}
function renderPh(){$('ph').innerHTML=photos.map((p,i)=>`<div><img src="${p}"><button onclick="photos.splice(${i},1);renderPh()">✕</button></div>`).join('')}
function addPh(inp){[...inp.files].slice(0,5-photos.length).forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);photos.push(c.toDataURL('image/jpeg',.65));renderPh()};im.src=r.result};r.readAsDataURL(f)});inp.value=''}
function saveEntry(){if(!$('edTitle').value.trim()&&!$('edText').innerText.replace(/\u200b/g,'').trim()&&!photos.length)return toast('Kuch likhein pehle ✍️');dirty=true;persist();toast('Page save ho gaya 🌸');closeEd()}
function delEntry(){if(!cur||!confirm('Ye page hamesha ke liye hata dein?'))return;const id=cur.id;delete entries[id];db.ref(base()+'/entries/'+id).remove();cur=null;dirty=false;photos=[];$('edTitle').value='';$('edText').innerHTML='';closeEd();toast('Page hata diya');render()}

/* ---------- BACKUP / PDF ---------- */
function exportJson(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({entries})],{type:'application/json'}));a.download='my_diary_backup.json';a.click()}
function importJson(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result).entries||{};Object.keys(d).forEach(k=>{d[k].id=k;d[k].text=d[k].text||'';d[k].date=d[k].date||iso(new Date())});Object.assign(entries,d);db.ref(base()+'/entries').update(d);toast('Backup restore ho gaya ✨');render()}catch(e){alert('Galat file!')}};r.readAsText(f)}
function printAll(){const a=sorted().reverse();if(!a.length)return toast('Diary abhi khali hai');
  $('print').innerHTML='<h1>My Diary</h1>'+a.map(e=>`<div class="pe"><h3>${e.date} ${e.mood||''} ${esc(e.title)}</h3><p>${esc(e.text).replace(/\n/g,'<br>')}</p><div>${(e.tags||[]).map(t=>'#'+esc(t)).join(' ')}</div>${(e.photos||[]).map(p=>`<img src="${p}">`).join('')}</div>`).join('');
  toast('Print screen mein "Save as PDF" chunein');setTimeout(()=>window.print(),600)}
</script>
